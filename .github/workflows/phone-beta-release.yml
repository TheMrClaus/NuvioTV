name: Phone Beta Release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Choose whether to preview, save as draft, or publish immediately"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - draft
          - publish
      manual_release:
        description: "Use manual tag/title without changing Gradle version"
        required: true
        default: false
        type: boolean
      version:
        description: "Target versionName for auto mode, for example 0.1.1-beta"
        required: false
        type: string
      version_code:
        description: "Optional versionCode override for auto mode. Defaults to current versionCode + 1."
        required: false
        type: string
      release_tag:
        description: "Manual mode tag. Required when manual release is enabled."
        required: false
        type: string
      release_title:
        description: "Manual mode GitHub release title. Required when manual release is enabled."
        required: false
        type: string
      downloader_code:
        description: "Optional downloader code footer"
        required: false
        type: string
      custom_release_notes:
        description: "Optional full Markdown release notes. When set, it replaces generated notes entirely."
        required: false
        type: string
      extra_notes:
        description: "Optional extra bullet lines, one per line"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: phone-beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phone-beta-release:
    runs-on: ubuntu-latest
    env:
      # Phone reads only what it needs at runtime — TV-only secrets
      # (Trakt OAuth, TMDB) are intentionally absent. Mirrors phone-release.yml.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      AVATAR_PUBLIC_BASE_URL: ${{ secrets.AVATAR_PUBLIC_BASE_URL }}
      TV_LOGIN_WEB_BASE_URL: ${{ secrets.TV_LOGIN_WEB_BASE_URL }}
      TRAKT_REDIRECT_URI: ${{ secrets.TRAKT_REDIRECT_URI }}
      AIOMETADATA_BASE_URL: ${{ secrets.AIOMETADATA_BASE_URL }}
      PARENTAL_GUIDE_API_URL: ${{ secrets.PARENTAL_GUIDE_API_URL }}
      INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
      TRAILER_API_URL: ${{ secrets.TRAILER_API_URL }}
      IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
      IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
      DONATIONS_BASE_URL: ${{ secrets.DONATIONS_BASE_URL }}
      DONATIONS_DONATE_URL: ${{ secrets.DONATIONS_DONATE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare phone signing config
        if: ${{ inputs.release_mode != 'dry_run' }}
        env:
          PHONE_KEYSTORE_BASE64: ${{ secrets.OMNIO_PHONE_RELEASE_KEYSTORE_BASE64 }}
          PHONE_KEY_ALIAS: ${{ secrets.OMNIO_PHONE_RELEASE_KEY_ALIAS }}
          PHONE_KEY_PASSWORD: ${{ secrets.OMNIO_PHONE_RELEASE_KEY_PASSWORD }}
          PHONE_STORE_PASSWORD: ${{ secrets.OMNIO_PHONE_RELEASE_STORE_PASSWORD }}
        run: |
          if [ -n "$PHONE_KEYSTORE_BASE64" ]; then
            echo "$PHONE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/omnio-phone.jks"
            {
              echo "OMNIO_PHONE_RELEASE_STORE_FILE=$RUNNER_TEMP/omnio-phone.jks"
              echo "OMNIO_PHONE_RELEASE_KEY_ALIAS=$PHONE_KEY_ALIAS"
              echo "OMNIO_PHONE_RELEASE_KEY_PASSWORD=$PHONE_KEY_PASSWORD"
              echo "OMNIO_PHONE_RELEASE_STORE_PASSWORD=$PHONE_STORE_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "CI_USE_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
          fi

      - name: Preview beta release
        if: ${{ inputs.release_mode == 'dry_run' }}
        run: |
          args=(python3 scripts/release_beta.py --module app-phone --dry-run)
          if [ "${{ inputs.manual_release }}" = "true" ]; then
            args+=(--manual-release --release-tag "${{ inputs.release_tag }}" --release-title "${{ inputs.release_title }}")
          else
            args+=("${{ inputs.version }}")
            if [ -n "${{ inputs.version_code }}" ]; then
              args+=(--version-code "${{ inputs.version_code }}")
            fi
            if [ -n "${{ inputs.release_tag }}" ]; then
              args+=(--release-tag "${{ inputs.release_tag }}")
            fi
            if [ -n "${{ inputs.release_title }}" ]; then
              args+=(--release-title "${{ inputs.release_title }}")
            fi
          fi
          if [ -n "${{ inputs.custom_release_notes }}" ]; then
            printf '%s\n' '${{ inputs.custom_release_notes }}' > "$RUNNER_TEMP/custom-release-notes.md"
            args+=(--custom-notes-file "$RUNNER_TEMP/custom-release-notes.md")
          fi
          if [ -n "${{ inputs.downloader_code }}" ]; then
            args+=(--downloader-code "${{ inputs.downloader_code }}")
          fi
          if [ -n "${{ inputs.extra_notes }}" ]; then
            args+=(--extra-notes "${{ inputs.extra_notes }}")
          fi
          "${args[@]}"

      - name: Upload preview notes
        if: ${{ inputs.release_mode == 'dry_run' }}
        uses: actions/upload-artifact@v7
        with:
          name: phone-beta-release-preview-${{ inputs.manual_release && inputs.release_tag || inputs.version }}
          path: build/release/release-notes-${{ inputs.manual_release && inputs.release_tag || inputs.version }}.md

      - name: Build beta release
        if: ${{ inputs.release_mode != 'dry_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(python3 scripts/release_beta.py --module app-phone)
          case "${{ inputs.release_mode }}" in
            draft) args+=(--draft) ;;
            publish) args+=(--publish) ;;
          esac
          if [ "${{ inputs.manual_release }}" = "true" ]; then
            args+=(--manual-release --release-tag "${{ inputs.release_tag }}" --release-title "${{ inputs.release_title }}")
          else
            args+=("${{ inputs.version }}")
            if [ -n "${{ inputs.version_code }}" ]; then
              args+=(--version-code "${{ inputs.version_code }}")
            fi
            if [ -n "${{ inputs.release_tag }}" ]; then
              args+=(--release-tag "${{ inputs.release_tag }}")
            fi
            if [ -n "${{ inputs.release_title }}" ]; then
              args+=(--release-title "${{ inputs.release_title }}")
            fi
          fi
          if [ -n "${{ inputs.custom_release_notes }}" ]; then
            printf '%s\n' '${{ inputs.custom_release_notes }}' > "$RUNNER_TEMP/custom-release-notes.md"
            args+=(--custom-notes-file "$RUNNER_TEMP/custom-release-notes.md")
          fi
          if [ -n "${{ inputs.downloader_code }}" ]; then
            args+=(--downloader-code "${{ inputs.downloader_code }}")
          fi
          if [ -n "${{ inputs.extra_notes }}" ]; then
            args+=(--extra-notes "${{ inputs.extra_notes }}")
          fi
          "${args[@]}"
