name: Deploy AIOStreams (self-host)

on:
  push:
    branches: [dev]
    paths:
      - 'infra/aiostreams-selfhost/**'
      - '.github/workflows/deploy-aiostreams-selfhost.yml'
  workflow_dispatch:

concurrency:
  group: deploy-aiostreams-selfhost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, aiostreams]
    defaults:
      run:
        working-directory: infra/aiostreams-selfhost
    steps:
      - uses: actions/checkout@v6

      - name: Render .env from secrets
        run: |
          umask 077
          cat > .env <<EOF
          POSTGRES_PASSWORD=${{ secrets.AIOSTREAMS_POSTGRES_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.AIOSTREAMS_REDIS_PASSWORD }}
          BASE_URL=${{ secrets.AIOSTREAMS_BASE_URL }}
          SECRET_KEY=${{ secrets.AIOSTREAMS_SECRET_KEY }}
          EOF

      - name: Apply local override file (if present)
        run: |
          # The host keeps a private override at ~/aiostreams-override.yml
          # for proxy/network wiring it doesn't want in the repo. Copy it in
          # so `docker compose` auto-merges it on `up`.
          if [ -f "$HOME/aiostreams-override.yml" ]; then
            cp "$HOME/aiostreams-override.yml" docker-compose.override.yml
            echo "Applied override from $HOME/aiostreams-override.yml"
          else
            echo "No override file at $HOME/aiostreams-override.yml — skipping"
          fi

      - name: Deploy stack
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps
