app = "omnio-imdb-ratings"
primary_region = "lhr"

[build]

[env]
HOST = "0.0.0.0"
LOG_LEVEL = "info"
NODE_ENV = "production"
PORT = "3000"
CACHE_TTL_SECONDS = "86400"
SCRAPE_TIMEOUT_MS = "10000"
SCRAPE_CONCURRENCY = "4"
RATE_LIMIT_PER_IP_PER_MIN = "120"

[http_service]
auto_start_machines = true
auto_stop_machines = "suspend"
force_https = true
internal_port = 3000
min_machines_running = 1

  [http_service.concurrency]
  hard_limit = 200
  soft_limit = 150
  type = "requests"

  [[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
cpus = 1
memory = "512mb"
memory_mb = 512
size = "shared-cpu-1x"
